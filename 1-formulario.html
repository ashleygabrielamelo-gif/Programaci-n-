<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
          :root{
            --very-light-pink: #C7C7C7; 
            --text-input-field: #F7F7F7; 
            --hospital-green: #ACD9B2; 
            --white: #FFFFFF; 
            --black: #000000; 
            --sm:14px;
            --md:16px;
            --lg:18px;
        }
        body{
             font-family: "Quicksand", sans-serif;
            margin: 0%
        }
        .login{ 
            width: 100%;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        .form-container{ 
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 350px;
        }
        .logo{ 
            width: 150px;
            margin-bottom:48px;
            justify-self:center;
            display:none;
            
        }
       .title{
        font-size:var(--lg);
        margin-bottom:12px;
        text-align:center;
       }
       .subtitle{
        color:var(--very-light-pink);
        font-size:var(--md);
        font-weight:300;
        margin-top: 0;
        text-align:center;
       }
       .label{
        font-size: var(--sm);
        font-weight: bold;
        margin-bottom: 4px;
       }
       .input{
        background-color: var(--text-input-field);
        border-radius: 8px;
        height: 30px;
        font-size: var(--md);
        padding: 6px;
        margin-bottom: 12px;
       }
       .form{
        display:flex;
        flex-direction: column;
       }
       .primary-button{
        background-color: var(--hospital-green);
        border: none;
        border-radius: 8px;
        color: var(--white);
        width: 100%;
         font-size:var(--md);
         font-weight: bold;
         height: 50px; 
       }
       .login-buttom{
        margin-top: 14px;
        margin-bottom: 30px;
       }
       @media (max-width:640px ){
        .logo{
            display: block;
        }
       }
    </style>
</head>
<body>
    <div class="login">
<div class="form-container">
 <img src="./Logo.jpeg" alt="imagendenegocio" class="logo"> 
    <h1 class="titulo">Create a new password</h1>
<p class="subtitle">Enter a new password for you account</p>
<form action="/"class="form">
    <label for="password" class="label">password </label>
    <input type="password" class="input input-passw" id="pasword" placeholder="********">

     <label for="new-password" class="label">Re-enter password </label>
    <input type="password" class="input input-passw" id="new-pasword" placeholder="*******">

    <input type="submit" value="confirm"class=primary-button login-button>
</form>
</div>
    </div>
    
</body>
</html>
