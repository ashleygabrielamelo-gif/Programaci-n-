<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                :root{
            --very-light-pink: #c7c7c7;
            --text-input-field:  #f7f7f7;
            --hospital-green: #ACD9B2; 
            --white: #FFFFFF;
            --black: #000000;
            --sm:14px;
            --md:16px;
            --lg:18px; 

    
        }
        body{
            font-family: "Quicksand", sans-serif;
            margin: 0;}
        .login{
            width: 100;
            height: 100vh;
            display: grid;
            place-items: center;
        }
        body{
            font-family: "Quicksand" , sans-serif;
            margin: 0;
        }
        .loging{
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;

        }
        .form-container{
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: 350px;
            justify-items: center;
        }
        .logo{
            width: 150px ;
            margin-bottom: 48px ;
            justify-content: center;
            display:  none;

        }
        .title{
            font-size:var(--lg);
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle{
            color:var(--very-light-pink);
            font-size:var(--md);
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 32px;
            text-align: center;

        }
        .email-image{
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: var(--text-input-field);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        .email-image img{ 
            width: 80px;

        }
        .resend span{
            color: var(--very-light-pink);
            
        }
        .resend a{
            color: var(--hospital-green);
            text-decoration: none;
        }
        .form{
            display: flex;
            flex-direction: column;

        }
        .primary-button{
            background-color: var(--hospital-green);
            border: none;
            border-radius: 8px;
            color: var(--white);
            width: 100%;
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }
        .login-button{
            margin-top: 14px;
            margin-bottom: 30px;
        }
        @media (max-width:  640px  ){
            .logo{
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="login">
        <div class="form-container">
            <img src="./ima.jpg" alt="imagenNegocio" class="logo" >
            <h1 class="titulo">Create a new password</h1>
            <p class="subtitle">please check your inbox for instructions on how to reset password</p>
            <div class="email-image">
                <img src="./correo.jpeg" alt="email-image">

            </div>
            <button class="primary-button  login-button">login</button>
            <p class="resend">
                <span>Didn't receive email?</span>
                <a href="">Resent</a>
            </p>
           
            </form>


        </div>

    </div>
    
</body>
</html>
